<div class="container">
  <!-- Map image container -->
  <div class="map-container" #container>
    <img alt="Karte von Olpe" [src]="shownMap" #img class="map-image"/>
    <canvas #canvas class="drawing-canvas"></canvas>
  </div>
  <div>
    <app-progress
      [progress]="progress"
    ></app-progress>
  </div>
</div>


<div class="bottom-controls">
  <div class="qr-code">
    <button
      type="button"
      pButton
      class="button-columns-button-icon"
      icon="pi pi-qrcode"
      style="font-size: 0.65em; margin-right: 5px"
      (click)="panel.toggle($event)"
    ></button>
    <p-overlayPanel #panel>
      <img src="assets/img/qr-code.png" alt="Map" style="max-width: 350px; max-height: 350px">
    </p-overlayPanel>
  </div>


  <!-- Drawing controls -->
  <div class="middle-controls">
    <div *ngIf="!generateEnabled" class="draw-controls">
      <input
        id="lineWidthRange"
        type="range"
        min="5"
        max="30"
        [value]="lineWidth"
        (input)="changeLineWidth($event)"
      />

      <button (click)="enableDrawing()" class="icon-button"
              [ngClass]="{ selected: selectedTool === 'draw' }">
        <i class="fas fa-pencil-alt"></i>
      </button>
      <button (click)="enableClosedShape()" class="icon-button"
              [ngClass]="{ selected: selectedTool === 'closed' }">
        <i class="fas fa-draw-polygon"></i>
      </button>
      <button (click)="enableEraser()" class="icon-button"
              [ngClass]="{ selected: selectedTool === 'eraser' }">
        <i class="fas fa-eraser"></i>
      </button>
      <button (click)="resetCanvas()" class="icon-button">
        <i class="fas fa-trash-alt"></i>
      </button>
    </div>

    <div class="container" style="margin-top: 20px">
      <!-- Input field with helper text and button -->
      <div class="input-container">
        <div class="helper-text">{{ 'ScenarioEnter' | translate }}</div>
        <div class="input-wrapper">
          <p-autoComplete
            #scenarioInput
            [(ngModel)]="inputText"
            placeholder="{{ 'WhatIf' | translate }}"
            [dropdown]="true"
            [showClear]="true"
            [suggestions]="filteredPrompts"
            (completeMethod)="filterPrompts($event); onInputChange(scenarioInput.value)"
            (onKeyUp)="handleKeyDown($event, scenarioInput)"
            (onSelect)="onInputChange(scenarioInput.value)"
          /> <!--updatePrompt(scenarioInput)-->

          <button
            class="generate-button"
            [disabled]="generateEnabled || !generatePermitted"
            (click)="updatePrompt(scenarioInput)"
          >
            {{ 'Generate' | translate }}
          </button> <!-- Update on Button Click -->

          <div class="flex justify-content-end flex-wrap" style="padding: 5px; margin-right: 20px">
            <p-button
              label="Reset"
              severity="danger"
              (click)="resetPrompt(scenarioInput)"
            ></p-button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="right-controls">
    <div class="language-switcher">
      <button (click)="switchLanguage('en')">
        <img src="assets/icons/uk-flag.png" alt="English" width="36">
      </button>
      <button (click)="switchLanguage('de')">
        <img src="assets/icons/german-flag.png" alt="Deutsch" width="36">
      </button>
    </div>
    @if (showModelSelector) {
      <div class="ai-model-selector">
        <label class="ai-model-label">{{ 'AI Model' | translate }}</label>
        <div class="ai-options" *ngFor="let option of modelOptions">
          <p-radioButton
            [name]="'aiModel'"
            [value]="option.value"
            [(ngModel)]="selectedModel"
            (onClick)="setAIModel($event)"
          ></p-radioButton>
          <label class="ai-option-label">{{ option.label }}</label>
        </div>
      </div>
    }
  </div>
</div>

<div style="margin-top: 20px">
  <app-thematic-worlds
    [reload]="reload"
    (mapToShow)="showMap($event)"
    (isMapEditable)="setGeneratedMapEditable($event)"
  ></app-thematic-worlds>
</div>

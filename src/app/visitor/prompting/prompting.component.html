<div>
  <app-nav-bar-visitor></app-nav-bar-visitor>
  <app-reset></app-reset>
</div>

<div class="container">

  <!-- Map image container -->
  <div class="map-container" #container>
    <img src="assets/img/olpe.jpg" #img class="map-image" />
    <canvas #canvas class="drawing-canvas"></canvas>
  </div>

  <!-- Drawing controls -->
  <div class="controls">
    <button (click)="changeLineWidth(2)">Thin</button>
    <button (click)="changeLineWidth(5)">Medium</button>
    <button (click)="changeLineWidth(10)">Thick</button>
    <button (click)="enableEraser()">Eraser</button>
    <button (click)="enableDrawing()">Draw</button>
    <button (click)="resetCanvas()">Reset</button>
  </div>

  <!-- Input field with helper text and button -->
  <div class="input-container">
    <div class="helper-text">{{ 'ScenarioEnter' | translate }}</div>
    <div class="input-wrapper">
      <input
        type="text"
        class="scenario-input"
        placeholder="{{ 'WhatIf' | translate }}"
        #scenarioInput
        (input)="onInputChange(scenarioInput.value)"
        (keydown.enter)="updatePrompt(scenarioInput)"> <!-- Update on Enter -->

      <button
        class="generate-button"
        [disabled]="!inputText.trim()"
        (click)="updatePrompt(scenarioInput)">{{ 'Generate' | translate }}</button> <!-- Update on Button Click -->
    </div>
  </div>
</div>

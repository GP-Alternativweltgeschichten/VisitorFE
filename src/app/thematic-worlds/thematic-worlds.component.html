<div class="grid">
  <div class="col-12">
    <div class="helper-text">{{ 'Themenwelten' | translate }}</div>
  </div>
  <!--  <div class="col-12">-->
  <!--    <p style="text-align: center">{{ 'ThemenweltWelcome' | translate }}</p>-->
  <!--  </div>-->
  <div class="col-12" style="height: fit-content; display: flex; overflow-x: scroll">
    <div *ngFor="let world of thematicWorlds">
      <div class="card-wrapper" [ngClass]="{ selected: selectedWorld === world }" (click)="showThematicWorld(world)">
        <p-card
          [header]="world.name"
          [style]="{width: '350px', height: '350px'}">
          <div style="display: flex; justify-content: center">
            <p-image  [src]="createImageFromBlob(world.image)" alt="{{ 'Picture' | translate }} {{world.name}}" width="230px"></p-image>
          </div>
          <p>{{ world.description }}</p>
      </p-card>
    </div>
  </div>
</div>
</div>
